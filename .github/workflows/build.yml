name: Build plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        run: mvn -B clean package
      - name: Zip datapack and resource pack
        run: |
          (cd datapack && zip -r ../PvPSMP-Datapack.zip pvpsmp_worldgen)
          (cd resourcepack && zip -r ../PvPSMP-ResourcePack.zip .)
          cp target/PvPSMP.jar PvPSMP.jar
          echo "PACK_SHA1=$(sha1sum PvPSMP-ResourcePack.zip | cut -d' ' -f1)" >> $GITHUB_ENV
      - name: Publish release (permanent download links)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          body: |
            Resource pack sha1: `${{ env.PACK_SHA1 }}`
          files: |
            PvPSMP.jar
            PvPSMP-Datapack.zip
            PvPSMP-ResourcePack.zip
